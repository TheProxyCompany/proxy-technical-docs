site_name: Proxy Docs
site_description: Understand Proxy, Life Map, Moves, and your Proxy address. Start here, then explore the technical reference.
site_author: The Proxy Company
copyright: Copyright &copy; 2026 The Proxy Company

site_url: https://docs.theproxycompany.com/
repo_url: https://github.com/TheProxyCompany
repo_name: The Proxy Company
edit_uri: ""

theme:
  name: material
  custom_dir: overrides
  font: false
  palette:
    scheme: slate
    primary: custom
    accent: custom

  features:
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - toc.follow
    - navigation.footer
  logo: assets/proxy-p-vector-tan.png
  favicon: assets/proxy-logo.png

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  generator: false
  homepage: https://theproxycompany.com
  scope: /

extra_css:
  - assets/stylesheets/extra.css

hooks:
  - hooks/preview_homepage.py

nav:
  - Start here: index.md
  - Using Proxy:
    - What is Proxy?: proxy/index.md
    - Your first session: proxy/getting-started.md
    - Life Map: proxy/life-map.md
    - Moves: proxy/moves.md
    - Party: proxy/party.md
    - Across your devices: proxy/devices.md
    - Roster: proxy/roster.md
    - Timeline: proxy/timeline.md
    - Integrations: proxy/integrations.md
    - Harnesses: proxy/harnesses.md
    - Models and credits: proxy/credits.md
  - Your Proxy address:
    - Overview: proxy-ing/index.md
    - Set up your address: proxy-ing/getting-started.md
    - Device approval: proxy-ing/device-approval.md
  - Developer reference:
    - Connect your app: proxy-ing/connect.md
    - Client API: proxy-ing/client-api.md
    - Address routes: proxy-ing/routes.md
    - Proxy CLI: proxy/cli.md
  - Orchard:
    - Overview: orchard/index.md
    - Production Use: orchard/production.md
    - Getting Started: orchard/getting-started.md
    - Client Example: orchard/client.md
    - Server Example: orchard/server.md
    - Streaming: orchard/streaming.md
    - Batching: orchard/batching.md
    - Multimodal Input: orchard/multimodal.md
    - Structured Output: orchard/structured-output.md
    - Tool Use: orchard/tool-use.md
    - Reasoning Levels: orchard/reasoning.md
    - Rust Client: orchard/rust.md
    - How It Runs: orchard/architecture.md
plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: false
      type: date

# For Vercel deployment
use_directory_urls: true
